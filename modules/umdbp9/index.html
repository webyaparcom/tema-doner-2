<style>

  .modulex-cagri-siparis-wa { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --yaziRenk--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-cagri-siparis-wa *, .modulex-cagri-siparis-wa *::before, .modulex-cagri-siparis-wa *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-cagri-siparis-wa :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-cagri-siparis-wa :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-cagri-siparis-wa :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-cagri-siparis-wa :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-cagri-siparis-wa img { display: block; max-width: 100%; }

  :where(.modulex-cagri-siparis-wa) img { height: auto; }
  .modulex-cagri-siparis-wa [hidden] { display: none !important; }
  .modulex-cagri-siparis-wa :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-cagri-siparis-wa :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }

  .modulex-cagri-siparis-wa-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-cagri-siparis-wa-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-cagri-siparis-wa-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-cagri-siparis-wa-dugme:hover { transform: translateY(-2px); }
  .modulex-cagri-siparis-wa-dugme--ikincil { background: transparent; color: --yaziRenk--; border-color: --cizgi--; }
  .modulex-cagri-siparis-wa-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-cagri-siparis-wa-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-cagri-siparis-wa-ust-blok { display: grid; gap: 12px; max-width: 760px; margin-block-end: clamp(28px, 4vw, 44px); }
  .modulex-cagri-siparis-wa-govde2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 0.75fr); gap: clamp(24px, 4vw, 56px); align-items: start; }
  .modulex-cagri-siparis-wa-govde2--tek { grid-template-columns: minmax(0, 1fr); max-width: 560px; }
  .modulex-cagri-siparis-wa-fis { position: relative; display: grid; gap: 14px; margin-block-end: 10px; padding: 26px clamp(18px, 3vw, 32px) 30px; background: --kartBg--; filter: drop-shadow(0 18px 22px color-mix(in srgb, --yaziRenk-- 14%, transparent)); }
  .modulex-cagri-siparis-wa-fis::after { content: ""; position: absolute; inset-inline: 0; inset-block-end: -8px; height: 8px; background: conic-gradient(from 135deg at 50% 0, --kartBg-- 90deg, transparent 0) 0 0 / 16px 8px repeat-x; }
  .modulex-cagri-siparis-wa-fbas { display: flex; align-items: center; gap: 10px; padding-block-end: 12px; border-block-end: 2px dashed --cizgi--; font-size: 0.9rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
  .modulex-cagri-siparis-wa-fikon { color: --accentInk--; font-size: 24px; }
  .modulex-cagri-siparis-wa-fsatirlar { display: grid; gap: 12px; }
  .modulex-cagri-siparis-wa-fsatir { display: grid; grid-template-columns: minmax(0, max-content) minmax(12px, 1fr) auto auto; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
  .modulex-cagri-siparis-wa-fad { transition: color 0.2s ease; }
  .modulex-cagri-siparis-wa-fnokta { align-self: end; margin-block-end: 6px; border-block-end: 2px dotted --cizgi--; }
  .modulex-cagri-siparis-wa-ffiyat { font-weight: 750; }
  .modulex-cagri-siparis-wa-adet { display: inline-flex; align-items: center; gap: 4px; }
  .modulex-cagri-siparis-wa:not(.modulex-cagri-siparis-wa--sfjs) .modulex-cagri-siparis-wa-adet { display: none; }
  .modulex-cagri-siparis-wa-adim { display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 1.5px solid --cizgi--; border-radius: 50%; background: transparent; color: --yaziRenk--; transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease; }
  .modulex-cagri-siparis-wa-adim:hover:not(:disabled) { border-color: --accent--; background: --accent--; color: --accentText--; }
  .modulex-cagri-siparis-wa-adim:disabled { cursor: default; color: --muted--; }
  .modulex-cagri-siparis-wa-aikon { font-size: 18px; }
  .modulex-cagri-siparis-wa-asay { min-width: 2ch; font-weight: 800; text-align: center; }
  .modulex-cagri-siparis-wa-fsatir--var .modulex-cagri-siparis-wa-fad { color: --accentInk--; font-weight: 750; }
  .modulex-cagri-siparis-wa-ftoplam { display: flex; justify-content: space-between; gap: 12px; padding-block-start: 12px; border-block-start: 2px dashed --cizgi--; font-weight: 800; }
  .modulex-cagri-siparis-wa-siparis { display: grid; justify-items: center; gap: 16px; padding: clamp(28px, 4vw, 40px) 20px; border-radius: --yuvarlak--; background: --vurguBg--; color: --vurguText--; text-align: center; }
  .modulex-cagri-siparis-wa-dev-wa { position: relative; display: grid; place-items: center; align-content: center; gap: 8px; width: clamp(164px, 18vw, 210px); aspect-ratio: 1; padding: 22px; border-radius: 50%; background: --vurguText--; color: --vurguBg--; font-weight: 800; line-height: 1.2; text-decoration: none; transition: transform 0.3s ease; }
  .modulex-cagri-siparis-wa-dev-wa:hover { transform: scale(1.05); }
  .modulex-cagri-siparis-wa-dev-wa .modulex-cagri-siparis-wa-wasvg { width: 52px; height: 52px; }
  .modulex-cagri-siparis-wa-halka { position: absolute; inset: -10px; border: 3px solid --vurguText--; border-radius: 50%; pointer-events: none; animation: modulex-cagri-siparis-wa-nabiz 2.2s ease-out infinite; }
  .modulex-cagri-siparis-wa-dtel { color: --vurguText--; font-size: clamp(1.4rem, 3vw, 1.9rem); font-weight: 800; text-decoration: none; font-variant-numeric: tabular-nums; }
  .modulex-cagri-siparis-wa-siparis .modulex-cagri-siparis-wa-saat, .modulex-cagri-siparis-wa-siparis .modulex-cagri-siparis-wa-saat .material-symbols-outlined { color: --vurguText--; }
  .modulex-cagri-siparis-wa-siparis .modulex-cagri-siparis-wa-cta { justify-content: center; margin: 0; }
  .modulex-cagri-siparis-wa-siparis .modulex-cagri-siparis-wa-dugme { background: --vurguText--; color: --vurguBg--; border-color: --vurguText--; }
  .modulex-cagri-siparis-wa-siparis .modulex-cagri-siparis-wa-dugme--ikincil { background: transparent; color: --vurguText--; border-color: color-mix(in srgb, --vurguText-- 50%, transparent); }
  .modulex-cagri-siparis-wa-siparis :focus-visible { outline-color: --vurguText--; }
  @keyframes modulex-cagri-siparis-wa-nabiz { from { transform: scale(0.92); opacity: 1; } to { transform: scale(1.22); opacity: 0; } }
  @media (max-width: 768px) {
    .modulex-cagri-siparis-wa-govde2 { grid-template-columns: minmax(0, 1fr); }
    .modulex-cagri-siparis-wa-fsatir { gap: 6px; }
  }
  .modulex-cagri-siparis-wa-wasvg { width: 1.25em; height: 1.25em; flex: none; }
  .modulex-cagri-siparis-wa-maddeler { display: grid; gap: 12px; }
  .modulex-cagri-siparis-wa-madde { display: flex; align-items: flex-start; gap: 12px; }
  .modulex-cagri-siparis-wa-mikon { flex: none; color: --accentInk--; font-size: 24px; }
  .modulex-cagri-siparis-wa-myazi { display: grid; gap: 2px; }
  .modulex-cagri-siparis-wa-myazi strong { font-weight: 700; }
  .modulex-cagri-siparis-wa-myazi small { color: --muted--; font-size: 0.92rem; }
  .modulex-cagri-siparis-wa-not { color: --muted--; font-size: 0.9rem; }
  .modulex-cagri-siparis-wa-saat { display: flex; align-items: center; gap: 8px; color: --muted--; font-size: 0.95rem; }
  .modulex-cagri-siparis-wa-saat .material-symbols-outlined { font-size: 20px; color: --accentInk--; }
  .modulex-cagri-siparis-wa-metin { max-width: 62ch; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-cagri-siparis-wa :is(.modulex-cagri-siparis-wa-baslik, .modulex-cagri-siparis-wa-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-cagri-siparis-wa-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-cagri-siparis-wa { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-cagri-siparis-wa *, .modulex-cagri-siparis-wa *::before, .modulex-cagri-siparis-wa *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-cagri-siparis-wa";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const siparisFis = (s, P) => {
        const satirlar = [...s.querySelectorAll("[data-sf]")];
        if (!satirlar.length) return;
        s.classList.add(P + "--sfjs");
        const wa = s.querySelector("a[data-sf-wa]");
        const taban = wa ? wa.getAttribute("href") || "" : "";
        const toplam = s.querySelector("[data-sf-toplam]");
        let nf = null;
        try { nf = new Intl.NumberFormat(document.documentElement.lang || undefined); } catch (x) { nf = null; }
        const yaz = (n) => (nf ? nf.format(n) : String(n));
        const guncelle = () => {
          const sec = [];
          satirlar.forEach((r) => {
            const n = Number(r.dataset.sfAdet) || 0;
            const o = r.querySelector("[data-sf-say]");
            if (o) o.textContent = yaz(n);
            const e = r.querySelector("[data-sf-eksi]");
            if (e) e.disabled = n < 1;
            r.classList.toggle(P + "-fsatir--var", n > 0);
            if (n > 0) sec.push(`${yaz(n)} × ${r.dataset.sf}`);
          });
          const top = satirlar.reduce((a, r) => a + (Number(r.dataset.sfAdet) || 0), 0);
          if (toplam) {
            toplam.hidden = top < 1;
            const t = toplam.querySelector("[data-sf-tsay]");
            if (t) t.textContent = yaz(top);
          }
          if (!wa || !taban) return;
          let u;
          try { u = new URL(taban, location.href); } catch (x) { return; }
          const metin = [wa.dataset.sfOnek || ""].concat(sec).filter(Boolean).join("\n");
          if (metin) u.searchParams.set("text", metin);
          wa.setAttribute("href", u.href.replace(/\?[^#]*/, (q) => q.replace(/\+/g, "%20")));
        };
        satirlar.forEach((r) => {
          r.querySelectorAll("[data-sf-arti], [data-sf-eksi]").forEach((b) => b.addEventListener("click", () => {
            const n = (Number(r.dataset.sfAdet) || 0) + (b.hasAttribute("data-sf-arti") ? 1 : -1);
            r.dataset.sfAdet = String(Math.max(0, Math.min(99, n)));
            guncelle();
          }));
        });
        guncelle();
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      siparisFis(s, P, az);
    });
  })();
</script>
